<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg     { fill: #0d1117; }
      .tbg    { fill: #161b22; }
      .tbar   { fill: #21262d; }
      .stroke { fill: none; stroke: #30363d; stroke-width: 1; }
      .dot-r  { fill: #ff5f57; }
      .dot-y  { fill: #febc2e; }
      .dot-g  { fill: #28c840; }
      text    { font-family: 'JetBrains Mono','Fira Code','Courier New',monospace;
                font-size: 13px; }
      .prompt { fill: #58a6ff; }
      .cmd    { fill: #e6edf3; }
      .out    { fill: #3fb950; }
      .dim    { fill: #8b949e; }
      .hi     { fill: #f78166; }
      .cursor { fill: #58a6ff; }

      .l1 { opacity:0; animation: show 0.1s 0.4s forwards; }
      .l2 { opacity:0; animation: show 0.1s 1.1s forwards; }
      .l3 { opacity:0; animation: show 0.1s 1.9s forwards; }
      .l4 { opacity:0; animation: show 0.1s 2.5s forwards; }
      .l5 { opacity:0; animation: show 0.1s 3.0s forwards; }
      .l6 { opacity:0; animation: show 0.1s 3.5s forwards; }
      .l7 { opacity:0; animation: show 0.1s 4.3s forwards; }
      .l8 { opacity:0; animation: show 0.1s 5.0s forwards; }
      .cur{ opacity:0; animation: show 0.1s 5.0s forwards,
                                 blink 1.1s 5.0s step-end infinite; }
      @keyframes show  { to { opacity: 1; } }
      @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }

      @media (prefers-reduced-motion: reduce) {
        .l1,.l2,.l3,.l4,.l5,.l6,.l7,.l8,.cur { opacity:1; animation:none; }
      }
    </style>
  </defs>

  <rect width="900" height="260" rx="10" class="bg"/>
  <rect x="24" y="20" width="852" height="224" rx="8" class="tbg"/>
  <rect x="24" y="20" width="852" height="224" rx="8" class="stroke"/>

  <path d="M24 28 a8 8 0 0 1 8 -8 h836 a8 8 0 0 1 8 8 v24 h-852 z" class="tbar"/>
  <circle cx="50" cy="36" r="6" class="dot-r"/>
  <circle cx="70" cy="36" r="6" class="dot-y"/>
  <circle cx="90" cy="36" r="6" class="dot-g"/>
  <text x="450" y="41" font-size="12" fill="#8b949e" text-anchor="middle">smita1078 — bash</text>

  <g class="l1">
    <text x="44" y="80"><tspan class="prompt">smita@github</tspan><tspan class="dim">:</tspan><tspan class="out">~</tspan><tspan class="dim">$</tspan><tspan class="cmd"> whoami</tspan></text>
  </g>
  <g class="l2">
    <text x="44" y="100"><tspan class="out">Smita Prajapati</tspan><tspan class="dim"> — Software Engineer · GSoC '26 @ Checkstyle</tspan></text>
  </g>

  <g class="l3">
    <text x="44" y="130"><tspan class="prompt">smita@github</tspan><tspan class="dim">:</tspan><tspan class="out">~</tspan><tspan class="dim">$</tspan><tspan class="cmd"> cat about.md</tspan></text>
  </g>
  <g class="l4">
    <text x="44" y="152"><tspan class="dim">▶ building</tspan><tspan class="cmd" x="200">Java / Spring Boot microservices / Test Automation</tspan></text>
  </g>
  <g class="l5">
    <text x="44" y="172"><tspan class="dim">▶ contributing</tspan><tspan class="hi" x="200">open source contributor</tspan></text>
  </g>
  <g class="l6">
    <text x="44" y="192"><tspan class="dim">▶ interested in</tspan><tspan class="cmd" x="200">distributed systems · developer tooling · quality infra</tspan></text>
  </g>

  <g class="l7">
    <text x="44" y="220"><tspan class="prompt">smita@github</tspan><tspan class="dim">:</tspan><tspan class="out">~</tspan><tspan class="dim">$</tspan><tspan class="cmd"> echo $STACK</tspan></text>
  </g>
  <g class="l8">
    <text x="44" y="238"><tspan class="out">Java</tspan><tspan class="dim"> · </tspan><tspan class="out">Spring Boot</tspan><tspan class="dim"> · </tspan><tspan class="out">Microservices</tspan><tspan class="dim"> · </tspan><tspan class="out">REST</tspan><tspan class="dim"> · </tspan><tspan class="out">Docker</tspan><tspan class="dim"> · </tspan><tspan class="out">Maven</tspan><tspan class="dim"> · </tspan><tspan class="out">JUnit</tspan><tspan class="dim"> · </tspan><tspan class="out">GCP</tspan></text>
  </g>

  <rect class="cur cursor" x="248" y="228" width="8" height="14" rx="1"/>
</svg> 
